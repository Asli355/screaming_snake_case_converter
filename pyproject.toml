[project]
name = "screaming-snake-case-converter"
version = "0.1.0"
description = "Converts between camelCase, PascalCase, snake_case, and SCREAMING_SNAKE_CASE identifier conventions."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
